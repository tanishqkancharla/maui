name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Node 24 ships npm 11, whose `npm ci` requires every optional
          # platform binary in the lockfile. Node 22 / npm 10 matches local
          # installs and the existing package-lock.json.
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build library
        run: npm run build:lib

      - name: Publish
        # Uses npm Trusted Publishing (OIDC). Configure the trusted publisher on
        # https://www.npmjs.com/package/@tanishqkancharla/maui → Settings →
        # Trusted Publisher: GitHub, tanishqkancharla/maui, publish.yml
        # setup-node sets NODE_AUTH_TOKEN when registry-url is set; an empty
        # token forces the legacy auth path and blocks OIDC. Unset it.
        run: unset NODE_AUTH_TOKEN && npm publish
