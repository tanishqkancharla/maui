name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # npm Trusted Publishing (OIDC) requires npm 11.5+.
          # Do not set registry-url: setup-node would write an empty
          # NODE_AUTH_TOKEN into .npmrc, which 404s on publish.
          node-version: 24
          cache: npm

      - name: Install dependencies
        # `npm ci` on npm 11 requires every optional platform binary in the
        # lockfile (darwin/win32/…). `npm install` matches this lockfile.
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build library
        run: npm run build:lib

      - name: Publish
        # Uses npm Trusted Publishing (OIDC). Configure the trusted publisher on
        # https://www.npmjs.com/package/@tanishqkancharla/maui → Settings →
        # Trusted Publisher: GitHub, tanishqkancharla/maui, publish.yml
        run: npm publish --access public
