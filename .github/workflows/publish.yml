name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build library
        run: npm run build:lib

      - name: Publish
        # Uses npm Trusted Publishing (OIDC). Configure the trusted publisher on
        # https://www.npmjs.com/package/@tanishqkancharla/maui → Settings →
        # Trusted Publisher: GitHub, tanishqkancharla/maui, publish.yml
        # Do not set NODE_AUTH_TOKEN — that forces the legacy token path.
        run: npm publish
